name: Dispatch

on:
  push:
    branches: [main, master]
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    steps:
      - name: Dispatch to phlix-plugins catalog
        env:
          GH_TOKEN: ${{ secrets.PHLIX_BOT_TOKEN }}
          # [PG-084] Context data is bound as env vars, never interpolated
          # into the run: script — a crafted ref/tag containing shell
          # command-substitution punctuation would otherwise expand in bash.
          PUSH_REF: ${{ github.ref }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_REPO: ${{ github.repository }}
        run: |
          gh api repos/detain/phlix-plugins/dispatches \
            --field event_type=plugin-push \
            --field "client_payload[ref]=$PUSH_REF" \
            --field "client_payload[sha]=$PUSH_SHA" \
            --field "client_payload[repo]=$PUSH_REPO"
